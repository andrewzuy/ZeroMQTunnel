[package]
name = "tunnel-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
zmq = "0.10"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tunnel-common = { path = "../tunnel-common" }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "rng"] }
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
