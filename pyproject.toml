[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmqtunnel"
version = "0.1.0"
description = "SSH-like local and remote port forwarding over CurveZMQ-encrypted tunnels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["zeromq", "tunnel", "ssh-forwarding", "encryption"]
authors = [
    {name = "Andrew Zuy"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyzmq>=26.0.0",
    "msgpack>=1.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
zmqtunnel = "zmqtunnel.cli:main"

[tool.setuptools.packages.find]
include = ["zmqtunnel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-s -v"  # Enable capture disabled (-s), show verbose output
