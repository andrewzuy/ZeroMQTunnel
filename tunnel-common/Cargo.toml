[package]
name = "tunnel-common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
uuid = { version = "1.0", features = ["v4", "rng", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["sync", "time"] }
x25519-dalek = "2.0"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
anyhow = "1.0"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
bytes = "1.0"
