# ZeroMQ Tunnel Server Configuration
# Default location: tools/../tunnel-server/config/
# OR specify with --config flag when starting server

[server]
control_port = 5555          # ZMQ ROUTER control socket port (non-privileged)
data_port = 5556             # Optional: ZMQ STREAM data socket port
listen_address = "0.0.0.0"   # Listen on all interfaces

[key]
key_file = "../tools/config/server.pem"  # Path to CURVE secret key (relative default)
                                    # OR use absolute path like /etc/tunnel/server.pem

[limits]
global_max_connections = 1000          # Maximum total concurrent connections
max_per_agent = 128                    # Maximum concurrent streams per agent

[timeout]
heartbeat_timeout = 30                 # Seconds between heartbeats (idle detection)
connection_idle_timeout = 300          # Close connection after idle period

[logging]
level = "info"                         # One of: info, debug, trace
target = ""                            # Optional file path for log output

[security]
enable_whitelist = false               # Enable agent key whitelist (default: false in dev)
whitelist_path = "/etc/tunnel/agent_whitelist.txt"  # Path to whitelist if enabled

[prometheus]
enabled = false                        # Export metrics to Prometheus format
port = 9090                           # Metrics server port (if enabled)
