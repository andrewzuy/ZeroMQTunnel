[package]
name = "zmq_tun"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
zmq = "0.10"
nix = { version = "0.29", features = ["ioctl", "net", "socket", "uio", "fs"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ratatui = "0.29"
crossterm = "0.28"
